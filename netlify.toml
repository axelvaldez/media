[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/admin/*"
  function = "auth-gate"

[[redirects]]
  from = "/images/*"
  to = "https://cdn.jsdelivr.net/gh/axelvaldez/media@main/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302
  force = false
